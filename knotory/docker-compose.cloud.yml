# 云端对象存储部署：语料与 SQLite 存 MinIO/S3，容器无状态可水平扩展（单实例写 SQLite 仍推荐）
services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-knotory}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-knotory-secret-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  minio-init:
    image: minio/mc:RELEASE.2024-12-18T13-15-44Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/knotory-corpus &&
      exit 0
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-knotory}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-knotory-secret-change-me}

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      KNOTORY_STORAGE_BACKEND: s3
      KNOTORY_CACHE_DIR: /cache
      KNOTORY_S3_ENDPOINT_URL: http://minio:9000
      KNOTORY_S3_BUCKET: knotory-corpus
      KNOTORY_S3_PREFIX: knotory
      KNOTORY_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-knotory}
      KNOTORY_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-knotory-secret-change-me}
      KNOTORY_S3_REGION: auto
    volumes:
      - knotory-cache:/cache
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://127.0.0.1:8000}
        NEXT_PUBLIC_KNOTORY_API_KEY: ${NEXT_PUBLIC_KNOTORY_API_KEY:-}
    ports:
      - "3010:3010"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  minio-data:
  knotory-cache:
